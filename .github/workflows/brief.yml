name: Build education brief

on:
  # GitHub cron is UTC and has no idea about British Summer Time, so a single
  # schedule would drift by an hour every October and March. Both times are
  # scheduled and a guard step below drops whichever one isn't 20:00 in London.
  #
  # 20:00, not a morning slot: real publish-time data from the feeds (see
  # tests/fixtures and the corpus) shows essentially nothing appears between
  # ~20:00 and ~05:00 London, with volume clustering 09:00-19:00 and peaking
  # late morning. A once-daily check minimizes average staleness by running
  # right after that window closes, not at the start of the next day -- a
  # 10am story is ~10h stale by a same-evening run vs. ~21h stale by a 7am
  # run the next morning. Nothing publishes overnight either way, so this
  # costs a morning reader nothing while being far fresher for anyone
  # checking during the day or evening.
  schedule:
    - cron: "0 19 * * *"   # 20:00 London during BST
    - cron: "0 20 * * *"   # 20:00 London during GMT
  workflow_dispatch:         # run it by hand any time, from the Actions tab
    inputs:
      window_hours:
        description: >-
          Lookback window in hours. Leave blank for the normal 96h (~4 day)
          window; widen it (e.g. 336 for 14 days) for a one-off backfill --
          safe to rerun, since dedup is by id against the corpus, not by
          window.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Is it actually 20:00 in London?
        id: guard
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "20" ]; then
            echo "London time is ${hour}:00 — proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "London time is ${hour}:00, not 20:00. This is the other"
            echo "seasonal cron firing. Skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Check feed health
        if: steps.guard.outputs.go == 'true'
        continue-on-error: true
        run: python -m src.validate

      - name: Build the brief
        if: steps.guard.outputs.go == 'true'
        env:
          # Empty/unset is safe: llm.available() treats a blank key the same
          # as no key at all and falls back to deterministic scoring, so this
          # can stay uncommented whether or not the ANTHROPIC_API_KEY repo
          # secret exists yet -- it activates the moment that secret is added.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          BRIEF_WINDOW_HOURS: ${{ github.event.inputs.window_hours }}
        run: python -m src.build

      - name: Commit the result
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name  "ed-brief bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs briefs
          # rank_score is recomputed for the whole corpus every run, so
          # corpus.json's `generated` timestamp changes even when nothing new
          # was found -- there is always something to commit, which is what
          # keeps this schedule from being disabled after 60 quiet days. The
          # guard below is defensive, not expected to trigger.
          if git diff --cached --quiet; then
            echo "Nothing new since the last run — no commit."
          else
            git commit -m "Brief for $(TZ=Europe/London date +%Y-%m-%d)"
            git push
          fi
