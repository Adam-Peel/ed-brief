name: Build education brief

on:
  # GitHub cron is UTC and has no idea about British Summer Time, so a single
  # schedule would drift by an hour every October and March. All four times
  # below are scheduled and a guard step drops whichever isn't 07:00 or
  # 19:00 in London right now.
  #
  # Two runs a day, aimed at the two commutes: 07:00 catches the overnight
  # trickle for the morning commute, 19:00 catches the day's main volume for
  # the evening one. Checked against real publish-time data from the feeds
  # (see tests/fixtures and the corpus): only ~9% of items are published in
  # the 20:00-07:00 window a 07:00 run exists to catch fresh; ~91% land in
  # 07:00-19:00, which is why 19:00 -- not the next morning -- is the run
  # that matters most for minimizing average staleness (a 10am story is
  # ~10h stale by a same-evening run vs. ~21h stale by a 7am run the next
  # day). Both runs cost about $0.001/day in LLM spend combined, so the
  # second run isn't there to save money -- see the README cost table.
  schedule:
    - cron: "0 6 * * *"    # 07:00 London during BST
    - cron: "0 7 * * *"    # 07:00 London during GMT
    - cron: "0 18 * * *"   # 19:00 London during BST
    - cron: "0 19 * * *"   # 19:00 London during GMT
  workflow_dispatch:         # run it by hand any time, from the Actions tab
    inputs:
      window_hours:
        description: >-
          Lookback window in hours. Currently defaulted to 1440 (60 days)
          for a one-off: getting every remaining deterministic-only item
          re-scored by the LLM. Change back to "" once that run is done --
          a 60-day window on every ordinary manual trigger is wider than
          needed and not the normal default for a reason.
        required: false
        default: "1440"

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Is it actually 07:00 or 19:00 in London?
        id: guard
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" = "07" ] || [ "$hour" = "19" ]; then
            echo "London time is ${hour}:00 — proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "London time is ${hour}:00, not 07:00 or 19:00. This is the"
            echo "other seasonal cron firing. Skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: Check feed health
        if: steps.guard.outputs.go == 'true'
        continue-on-error: true
        run: python -m src.validate

      - name: Build the brief
        if: steps.guard.outputs.go == 'true'
        env:
          # Empty/unset is safe: llm.available() treats a blank key the same
          # as no key at all and falls back to deterministic scoring, so this
          # can stay uncommented whether or not the ANTHROPIC_API_KEY repo
          # secret exists yet -- it activates the moment that secret is added.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
          BRIEF_WINDOW_HOURS: ${{ github.event.inputs.window_hours }}
        run: python -m src.build

      - name: Commit the result
        if: steps.guard.outputs.go == 'true'
        run: |
          git config user.name  "ed-brief bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs briefs
          # rank_score is recomputed for the whole corpus every run, so
          # corpus.json's `generated` timestamp changes even when nothing new
          # was found -- there is always something to commit, which is what
          # keeps this schedule from being disabled after 60 quiet days. The
          # guard below is defensive, not expected to trigger.
          if git diff --cached --quiet; then
            echo "Nothing new since the last run — no commit."
          else
            git commit -m "Brief for $(TZ=Europe/London date '+%Y-%m-%d %H:%M')"
            git push
          fi
