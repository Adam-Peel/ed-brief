# How items get ranked.
#
# Final score for an item =
#     source weight
#   + sum of the weights of every topic group that matches
#   + recency bonus
#   + mute penalties (negative)
#
# A topic group scores ONCE however many of its terms match, so an article
# that repeats a keyword twenty times gains nothing over one that says it
# once. A match in the TITLE is worth `title_multiplier` times a match in
# the summary body.
#
# Tags come from the Tag Index in claude/filing-convention.md, so a tag on a
# brief item and a tag in Zotero are the same string. Two are new and marked
# NEW — per rule 5.2 of the filing convention, add them to the Tag Index
# before relying on them.

title_multiplier: 1.6

recency:
  # Items decay toward zero bonus as they age. This feeds the deterministic
  # raw score below, not rank_score -- see rank_score: at the bottom, which is
  # the separate, corpus-wide age penalty applied after scoring.
  half_life_hours: 60
  max_bonus: 2.5

# Ceiling used to normalise the deterministic raw score onto a fixed 0-10
# scale: norm = min(raw, deterministic_scale_max) / deterministic_scale_max * 10.
# FIXED, not batch-relative -- unlike the proof of concept, which normalised
# against the min/max of whatever happened to be in that run's batch. That
# breaks once items persist across runs: two runs are different batches, so
# the same raw score would land at different points on the scale. A fixed
# ceiling means the same raw score always means the same thing, in this run
# or three weeks from now. ~25 is comfortably above what a strong two-signal
# story scores (see the old calibration note this replaced: a single strong
# headline hit was 8-11 points).
deterministic_scale_max: 25.0

# Final relevance = (1 - llm_weight) * deterministic_norm + llm_weight * llm_score.
# Both inputs are already 0-10 by the time they're blended. Deterministic-only
# items (no LLM available) use deterministic_norm directly.
llm_weight: 0.6

# How many new items go into a single LLM call before the ingest step chunks
# into another batch. Same number the proof of concept used as its silent
# per-run candidate cap (MAX_CANDIDATES); here nothing is silently dropped --
# it's just a batch size, and every new item eventually gets scored.
llm_batch_size: 45

# Model for the LLM ranking pass. This is a nuanced-classification task
# ("is this actually relevant"), not deep multi-step reasoning, so cost
# scales with model choice far more than judgement quality does at this
# task size -- Sonnet over Haiku is chosen for judgement, not because Haiku
# was failing. BRIEF_LLM_MODEL env var overrides this for local testing.
llm_model: claude-sonnet-5

# Where the reader actually is right now, dropped into the LLM rubric
# (src/llm.py's RUBRIC) as {reader_stage}. A config value, not hardcoded in
# the prompt string, because it WILL go stale -- and the reader's priorities
# genuinely shift when it does: once training starts, induction/mentoring/
# the ITTECF outrank bursaries and "routes in" news; once they're a working
# teacher, ITT news itself becomes background noise. Update this, not the
# code, when that happens.
llm_reader_stage: "at the point of entering initial teacher training"

tiers:
  # Fixed thresholds on the FROZEN relevance scale (0-10), not the raw
  # deterministic sum -- tiering happens once per item, after the
  # deterministic/LLM blend, and is recomputed every build in case these cuts
  # change later. Anchored to the LLM rubric's own anchors in llm.py: 8 =
  # "directly relevant to history ITT", 5 = "useful to any teacher generally".
  #
  # Deliberately offset by 0.05 from the "round" number (8.00 -> 7.95, etc):
  # the site displays scores to 1 decimal place, and a threshold sitting
  # exactly on a display boundary (e.g. 2.50) means anything in [2.45, 2.50)
  # DISPLAYS as "2.5" (rounds up) while actually tiering as the one below --
  # a card that visually looks tied with the cut but isn't. Landing the
  # threshold at the MIDPOINT between two display buckets instead (2.45) means
  # every value that displays "2.4" or lower is genuinely below the cut, and
  # everything displaying "2.5" or higher is genuinely at/above it -- 2dp
  # thresholds resolve the ambiguity so the display can stay at the cleaner
  # 1dp, rather than the other way around.
  lead: 7.95     # "Read these"
  worth: 4.95    # "Worth a look"
  rest: 2.45     # "Everything else" -- below this, "Low relevance"
  # anything below `rest` → "Low relevance", collapsed behind its own
  # separate toggle on the site (not bundled with "Everything else"), so
  # browsing the rest of the corpus still doesn't mean wading through
  # near-zero-score noise unless you specifically ask for it too.

# Items scoring below this are excluded from every PUBLISHED surface (site,
# API, archive) entirely -- not just hidden behind a toggle like the tiers
# above. This is a real exception to "the API always returns the full live
# corpus": below the floor, there's nothing worth a reader's time, so
# there's nothing for a future re-ranker to reconsider either. They still
# get PERSISTED to data/corpus.json (see corpus.publishable()), just not
# published -- excluding them from the corpus entirely would mean the same
# worthless item gets re-fetched and re-scored by the LLM on every run until
# it aged out of the fetch window, for zero benefit.
#
# Checked against rank_score (the decayed, displayed value), not the frozen
# relevance -- see the comment on publishable() in corpus.py. Set at 1.05,
# the same "midpoint between display buckets" trick as the tiers above:
# everything that would display "1.0" or lower is excluded, everything
# displaying "1.1" or higher is kept.
publish_floor: 1.05

# The published site's own URL. Needed for the RSS feed (a channel-level
# <link> is required by the spec) and its autodiscovery tag on the site --
# nothing here is used for fetching, this is purely publishing metadata
# about where the output itself lives. Update if the repo is ever renamed
# or moved to a custom domain.
site_url: https://adam-peel.github.io/ed-brief/

# How long an item stays in the rolling list after first being seen.
retention_days: 14

# rank_score = relevance - (days since first_seen * age_penalty_per_day),
# floored at 0. Recomputed for the WHOLE corpus on every build so fresher
# items outrank equally-relevant stale ones -- relevance itself never changes
# once frozen. 0.15/day means a two-week-old item has drifted about 2 points
# below an identically-scored story from today, enough to reorder without
# swamping a genuinely more significant older story.
rank_score:
  age_penalty_per_day: 0.15

# ---------------------------------------------------------------------------
# Topic groups
# ---------------------------------------------------------------------------
# Ordered loosely by how much they matter to you right now: subject-specific
# history teaching and routes into the profession outrank general schools
# policy, which outranks sector news.

topics:

  # --- Your subject ---------------------------------------------------------

  - tag: sub-history
    weight: 7.0
    description: History as a school subject -- curriculum, GCSE/A-level, departments.
    terms:
      - history curriculum
      - history teacher
      - history teaching
      - teaching history
      - history gcse
      - history a-level
      - history a level
      - history department
      - school history
      - historical association
      - key stage 3 history
      - ks3 history

  - tag: sub-local-nottinghamshire   # NEW — add to Tag Index
    weight: 5.0
    new: true
    description: >-
      Nottinghamshire local HISTORY, heritage, or archaeology specifically --
      a deliberate regional premium, not a generic "mentions Nottingham" one.
    terms:
      # Bare place names (2026-08-21: "nottingham", "wollaton", "newstead
      # abbey") turned out unsafe on their own -- a Halloween cinema night AT
      # Newstead Abbey matched just as readily as a genuine piece about the
      # abbey's history, and outranked real education policy news. Every term
      # below now pairs a place with a history/heritage/archaeology signal,
      # so an event merely HELD at a historic site no longer qualifies.
      - nottinghamshire history
      - nottingham history
      - history of nottingham
      - history of nottinghamshire
      - nottinghamshire heritage
      - nottingham heritage
      - nottinghamshire archaeology
      - nottingham archaeology
      - nottingham castle
