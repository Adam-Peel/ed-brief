# ---------------------------------------------------------------------------
# Mutes — applied as negative weight, once per group.
# ---------------------------------------------------------------------------
# These stop the sector feeds burying the brief in things outside your scope.
# A muted item is not deleted; it just sinks. Raise the penalty to bury harder.

mutes:
  - name: higher-education
    weight: -5.0
    terms:
      - vice-chancellor
      - university funding
      - tuition fees
      - undergraduate
      - ucas
      - student loan
      - university of
      - russell group
      - freshers

  - name: early-years
    weight: -3.0
    terms:
      - nursery
      - childminder
      - early years foundation
      - eyfs
      - reception baseline
      - childcare

  - name: not-england
    weight: -2.0
    terms:
      - curriculum for excellence
      - scottish qualifications
      - sqa
      - donaldson
      - estyn
      - curriculum for wales

  - name: sport-and-fluff
    weight: -4.0
    terms:
      - school sport
      - football
      - world cup
      - celebrity
      - reality tv

  - name: quiz-and-trivia
    weight: -4.0
    terms:
      # HistoryExtra publishes a genuine mix of history features alongside a
      # steady stream of quizzes and crosswords, which are entertainment, not
      # news -- this sinks those specifically without touching the features.
      - quiz of the week
      - daily quiz
      - history crossword
      - crossword of the week

  - name: pre-1066
    weight: -3.0
    terms:
      # The secondary curriculum here is c.1066-present -- classical/ancient
      # content is real history, but not curriculum-relevant, so it's muted
      # rather than removed (still findable under "Low relevance" if wrong).
      # Deliberately excludes Anglo-Saxon/Viking-era terms: those genuinely
      # straddle 1066 as pre-Conquest context on some GCSE specs (e.g.
      # "Anglo-Saxon and Norman England, c1060-88"), so they're left for the
      # LLM pass's date judgement rather than a blanket keyword mute. See the
      # RUBRIC in llm.py for the equivalent (and more nuanced) instruction.
      - ancient rome
      - ancient greece
      - ancient egypt
      - mesopotamia
      - roman empire
      - roman britain
      - prehistoric
      - stone age
      - bronze age
      - trojan war
      - julius caesar
      - alexander the great
      - sparta
      - pharaoh

  - name: ofsted-non-schools
    weight: -6.0
    terms:
      # Ofsted's remit spans far more than school inspection -- children's
      # social care, unregistered/illegal children's homes, fostering,
      # adoption. A story about that remit matches pol-ofsted's terms (the
      # word "Ofsted" alone) just as strongly as a genuine school-inspection
      # story, even though it's not about what happens in a classroom.
      # Weighted to cancel almost all of pol-ofsted's title-matched
      # contribution (~8.0 at the +5.0 weight and 1.6x title multiplier), not
      # just soften it -- these are consistently near-zero relevance to a
      # secondary trainee, not merely "less relevant." Added 2026-08-21 after
      # four social-care Ofsted stories all outscored a genuinely relevant
      # GCSE-and-mental-health story; see the same distinction, generalised
      # beyond just Ofsted, in the LLM RUBRIC in llm.py.
      - children's home
      - children's social care
      - unregistered children's home
      - fostering
      - adoption agency
      - social care inspection
