# Sources for the education news brief.
#
# weight  — a nudge applied to every item from this source, before topic scoring.
#           Use it to reflect how consistently a source carries things you care
#           about, not how good the source is. Range roughly -3 to +3.
# enabled — set false to mute a source without deleting its config.
#
# Run `python -m src.validate` to check every URL still resolves.

feeds:
  # ---- Verified reachable 2026-08-21 -------------------------------------

  - id: bbc-education
    name: BBC Education
    url: https://feeds.bbci.co.uk/news/education/rss.xml
    weight: 0.5
    enabled: true

  - id: schools-week
    name: Schools Week
    url: https://schoolsweek.co.uk/feed/
    weight: 2.0
    enabled: true
    note: >
      Highest-signal source for policy, Ofsted and workforce. Weighted up
      because almost everything it publishes is relevant to a new entrant.
      As of 2026-08-21 this domain is behind Cloudflare + Kasada bot
      management (a JS-challenge anti-bot layer, identifiable by the
      `ki-edge` response header and `__cf_bm` cookie) and returns 403 to
      every plain HTTP client -- confirmed both locally and from the real
      GitHub Actions run, and not fixable by changing the User-Agent, since
      the block isn't UA-based. Left enabled rather than disabled: the build
      already degrades gracefully around a dead feed (reported in
      meta.json/the footer, never fails the run), so there's no harm in
      leaving it on in case the block lifts, and this note explains why it's
      showing as unhealthy rather than leaving that a mystery. A fix would
      need a JS-capable fetcher (e.g. a headless browser) or an RSS-bridge
      instance in front of it -- out of scope for the current fetch.py.

  - id: fe-week
    name: FE Week
    url: https://feweek.co.uk/feed/
    weight: -0.5
    enabled: true
    note: >
      Post-16 focus. Weighted down slightly since much of it concerns FE
      colleges rather than secondary; topic scoring still surfaces the
      qualifications-reform stories that matter. Same Cloudflare + Kasada
      block as Schools Week above, as of 2026-08-21 -- see that note.

  - id: dfe
    name: DfE (gov.uk)
    url: https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=department-for-education
    weight: 1.5
    enabled: true
    note: Primary source. Statutory announcements land here before commentary.

  - id: ofsted
    name: Ofsted (gov.uk)
    url: https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=ofsted
    weight: 1.5
    enabled: true

  - id: ofqual
    name: Ofqual (gov.uk)
    url: https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=ofqual
    weight: 1.0
    enabled: true

  - id: guardian-education
    name: Guardian Education
    url: https://www.theguardian.com/education/rss
    weight: 0.5
    enabled: true

  - id: guardian-schools
    name: Guardian Schools
    url: https://www.theguardian.com/education/schools/rss
    weight: 0.5
    enabled: true

  - id: oxford-education
    name: Oxford Department of Education
    url: https://www.education.ox.ac.uk/feed/?post_type=news
    weight: 0.0
    enabled: true
    note: >
      Verified reachable 2026-08-21 -- note the ?post_type=news query string;
      the plain /feed/ on this WordPress site is real but always empty
      because their news items are a custom post type, not the default
      "post". Content is genuine education research (pupil feedback studies,
      AI in education, national policy evaluations) alongside some internal
      academic news (staff honours, PhD/fellowship announcements) that isn't
      classroom-relevant, so weighted neutral like HistoryExtra -- the
      cog-cognitive-load topic group is what should surface the good pieces.

  - id: nottingham-education
    name: Nottingham School of Education
    url: https://www.nottingham.ac.uk/education/news/index.aspx?schoolNewsListings_SyndicationType=1
    weight: 0.0
    enabled: true
    note: >
      Verified reachable 2026-08-21. Same profile as Oxford above: real
      pedagogy/education-research content mixed with international
      partnership and staff-award announcements, so weighted neutral rather
      than up.

  - id: cambridge-history
    name: Cambridge Faculty of History
    url: https://www.hist.cam.ac.uk/rss.xml
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21 as an actual HISTORY-research source, distinct from
      the education-faculty feeds above -- new scholarship, not pedagogy.
      Verified reachable. Content is a mix of genuine research (new books,
      prize wins for historical work) and faculty-internal news (staff
      profiles, building restoration) at roughly one item per 10 days;
      weighted the same as HistoryExtra for the same reason -- real value,
      but not universally relevant, so topic scoring and the pre-1066 mute
      do the filtering.

  - id: warwick-history
    name: Warwick History Department
    url: https://warwick.ac.uk/sitebuilder2/api/rss/news.rss?page=/fac/arts/history/news/&rss=true
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21. Verified reachable via the RSS link Warwick's own
      news page advertises (not a guessed URL). Low volume (roughly monthly)
      and mostly new-book/prize announcements rather than research findings
      themselves, but each one is a real, citable piece of new scholarship --
      weighted like the other research sources above.

  - id: nottingham-hidden-history
    name: Nottingham Hidden History Team
    url: https://nottinghamhiddenhistoryteam.wordpress.com/feed/
    weight: 2.0
    enabled: true
    note: >
      Added 2026-08-21, suggested by the owner. Verified reachable and
      genuinely active (last post June 2026, roughly monthly). Every entry is
      Nottinghamshire local history/folklore/archaeology -- weighted like
      Schools Week (2.0) because almost everything this source publishes is
      exactly what the sub-local-nottinghamshire topic group and the LLM
      rubric's Nottinghamshire premium exist to surface.

  - id: heritage-calling
    name: Heritage Calling (Historic England)
    url: https://heritagecalling.com/feed/
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21, suggested by the owner as "the Historic England
      blog" -- this is its real domain (heritagecalling.com, not
      historicengland.org.uk, which 403s any request). Verified reachable,
      active weekly. Deliberately NOT using the /tag/nottingham/feed/ or
      /tag/nottinghamshire/feed/ variants: both are real but stale (most
      recent tagged posts April 2025 and January 2024), so filtering to them
      would mean this source almost never contributes. Using the general
      feed instead and letting sub-local-nottinghamshire catch the
      Nottinghamshire pieces when they appear; the rest is still genuine
      national heritage/architecture content, weighted like HistoryExtra.

  - id: chartered-college
    name: Chartered College of Teaching
    url: https://chartered.college/news-blogs/feed/
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21, found while searching for sources matching the LLM
      rubric's expanded categories (classroom practice, Ofsted, ITT/CPD).
      Verified reachable and active (posts through Jul 2026). NOT the site's
      plain /feed/ -- that one is a "Partner" directory (discount-scheme
      listings for corporate partners), not news, and was rejected after
      checking its actual item titles. /news-blogs/feed/ is the real
      article feed, found via RSS autodiscovery on that specific page.
      Content mixes genuine practice/policy pieces ("When the inspector
      calls: teacher agency...") with some international/generic CPD
      content, so weighted like HistoryExtra rather than up.

  - id: ucet
    name: UCET (ITT providers)
    url: https://feeds.feedburner.com/ucet-news
    weight: 1.5
    enabled: true
    note: >
      Added 2026-08-21. Universities' Council for the Education of
      Teachers -- the ITT sector's own representative body, i.e. exactly
      the "ITT providers themselves: accreditation, inspection, or
      placement-supply" category the rubric added this round. Verified
      reachable and active (5 items, most recent 27 Jul 2026): policy
      correspondence with the DfE, ITE research group updates, provider
      conferences. Weighted like DfE -- primary-source, not commentary.

  - id: ucet-blog
    name: UCET Blog
    url: https://feeds.feedburner.com/ucet-blog
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21, owner-suggested. Sits alongside `ucet` (ucet-news)
      rather than replacing it -- verified reachable, distinct content:
      opinion/analysis pieces on ITE ("A Profession-Led Vision for High
      Quality ITE") rather than that feed's policy-correspondence/conference
      updates. Weighted like Chartered College/TeacherToolkit -- commentary,
      not primary-source.

  - id: teachertoolkit
    name: TeacherToolkit
    url: https://www.teachertoolkit.co.uk/blog/feed
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21, owner-suggested. Ross McGill's blog, widely cited as
      one of the most-read UK teacher blogs. Verified reachable and active
      (posts through 12 Aug 2026); content is squarely classroom-practice
      and Ofsted/curriculum commentary ("What Ofsted Data Reveals About
      Curriculum and Teaching"). Weighted like Chartered College.

  - id: learning-spy
    name: David Didau (The Learning Spy)
    url: https://daviddidau.substack.com/feed
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21, owner-suggested as "The Learning Spy". That site's
      own feed (learningspy.co.uk/feed) 404s -- Didau has moved his active
      writing to Substack, which has a real, weekly-ish feed (5 posts in
      the last month, verified). Known specifically for evidence-informed
      teaching critique, overlapping cog-cognitive-load and the ped- topics.
      Weighted the same as HistoryExtra/Chartered College.

  - id: british-newspaper-archive
    name: British Newspaper Archive Blog
    url: https://blog.britishnewspaperarchive.co.uk/feed/
    weight: 0.0
    enabled: true
    note: >
      Added 2026-08-21, from the same feedspot.com list. Verified reachable
      and active (most recent 20 Jul 2026). Real historical content sits
      alongside heavy subscription marketing ("Hot Off The Press -- New
      Titles This Week", "Register now and explore The Archive") -- the
      genuine pieces (Sheffield industrial conditions, naval disease
      outbreaks) are worth having, but this is "history wrapped around a
      product", not independent journalism. Weighted neutral, same
      reasoning as Visit Nottinghamshire, rather than up.

  - id: past-and-present
    name: Past & Present Blog
    url: https://www.pastandpresent.org.uk/feed/
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21, from the same feedspot.com list. Verified reachable
      and active (most recent 14 Jul 2026) -- a genuinely well-regarded
      academic history journal's blog, not a content mill. Corrected
      2026-08-21: originally weighted neutral partly because the sample
      skewed toward non-England global/comparative history (Ottoman
      religious history, transatlantic slavery, Mexico-Algiers
      connections) -- that reasoning was wrong. Global/world history
      (Empire, Cold War, Russia, China, apartheid) is standard, growing
      GCSE/A-level content, not a mismatch; the LLM rubric's CORE bullet
      now says so explicitly. Raised to match HistoryExtra/Cambridge/
      Warwick. The other real caveat still applies and isn't a geography
      issue: some content is academic-community-internal (prize wins,
      symposium programmes) rather than reader-usable -- same profile as
      Cambridge Faculty of History, weighted the same way despite it.

  - id: history-teacher-training-nottingham
    name: Becoming a History Teacher (Nottingham)
    url: https://uonhistoryteachertraining.school.blog/feed/
    weight: 2.0
    enabled: true
    note: >
      Added 2026-08-21, from feedspot.com's "History Education RSS Feeds"
      list. University of Nottingham's PGCE history training blog.
      Verified reachable and very active (most recent 17 Aug 2026, days
      before adding). About as precise a fit as this project has found:
      HISTORY-specific ITT/mentoring/classroom-practice content, written
      by trainers, from Nottingham -- real titles include "Mentoring
      beginning and early career teachers" and "Resisting the pressure to
      comment beyond your expertise". Weighted like Schools Week/
      Nottingham Hidden History Team.

  - id: royal-historical-society
    name: Royal Historical Society Blog
    url: https://blog.royalhistsoc.org/feed/
    weight: 1.0
    enabled: true
    note: >
      Added 2026-08-21, same list. The UK's principal learned society for
      history, alongside the Historical Association. Verified reachable
      and active (most recent 20 Jul 2026). Mixed profile like Cambridge/
      Warwick/Past & Present: genuine scholarship (oral history methods,
      the value of a history PhD) alongside society-internal news (Council
      elections) -- weighted the same as those rather than up.

  - id: ben-newmark
    name: Ben Newmark
    url: https://bennewmark.wordpress.com/feed/
    weight: 0.5
    enabled: true
    note: >
      Added 2026-08-21, same list. A well-known UK teacher-commentator's
      personal blog. Verified reachable and active (most recent 7 Jul
      2026). NOT history-specific -- content is general professional
      practice and SEND/inclusion philosophy ("EHCPs, J S Mill and the
      Tyranny of the Majority"), not subject-specific teaching. Weighted
      lower than the history-specific sources above, but real and
      relevant to the SEND/professional-context categories.

  - id: national-archives-blog
    name: The National Archives Blog
    url: https://www.nationalarchives.gov.uk/feeds/blogs.xml
    weight: 1.5
    enabled: true
    note: >
      Added 2026-08-21, owner-found. Not the blocked blog.
      nationalarchives.gov.uk subdomain checked earlier -- a different path
      under the main domain, unaffected by that block. Verified reachable
      and genuinely current (most recent item published the same day this
      was added) through the real fetch pipeline. Exactly the primary-
      source-release category the LLM rubric names explicitly: real recent
      titles include "Uncovering precious medieval silk seal bags in our
      collection" and "Three archives gain accredited status". Weighted
      like DfE -- primary-source, not commentary.

