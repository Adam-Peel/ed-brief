# Sources for the education news brief.
#
# weight  — a nudge applied to every item from this source, before topic scoring.
#           Use it to reflect how consistently a source carries things you care
#           about, not how good the source is. Range roughly -3 to +3.
# enabled — set false to mute a source without deleting its config.
#
# Run `python -m src.validate` to check every URL still resolves.

feeds:
  # ---- Verified reachable 2026-08-21 -------------------------------------

  - id: bbc-education
    name: BBC Education
    url: https://feeds.bbci.co.uk/news/education/rss.xml
    weight: 0.5
    enabled: true

  - id: schools-week
    name: Schools Week
    url: https://schoolsweek.co.uk/feed/
    weight: 2.0
    enabled: true
    note: >
      Highest-signal source for policy, Ofsted and workforce. Weighted up
      because almost everything it publishes is relevant to a new entrant.
      As of 2026-08-21 this domain is behind Cloudflare + Kasada bot
      management (a JS-challenge anti-bot layer, identifiable by the
      `ki-edge` response header and `__cf_bm` cookie) and returns 403 to
      every plain HTTP client -- confirmed both locally and from the real
      GitHub Actions run, and not fixable by changing the User-Agent, since
      the block isn't UA-based. Left enabled rather than disabled: the build
      already degrades gracefully around a dead feed (reported in
      meta.json/the footer, never fails the run), so there's no harm in
      leaving it on in case the block lifts, and this note explains why it's
      showing as unhealthy rather than leaving that a mystery. A fix would
      need a JS-capable fetcher (e.g. a headless browser) or an RSS-bridge
      instance in front of it -- out of scope for the current fetch.py.

  - id: fe-week
    name: FE Week
    url: https://feweek.co.uk/feed/
    weight: -0.5
    enabled: true
    note: >
      Post-16 focus. Weighted down slightly since much of it concerns FE
      colleges rather than secondary; topic scoring still surfaces the
      qualifications-reform stories that matter. Same Cloudflare + Kasada
      block as Schools Week above, as of 2026-08-21 -- see that note.

  - id: dfe
    name: DfE (gov.uk)
    url: https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=department-for-education
    weight: 1.5
    enabled: true
    note: Primary source. Statutory announcements land here before commentary.

  - id: ofsted
    name: Ofsted (gov.uk)
    url: https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=ofsted
    weight: 1.5
    enabled: true

  - id: ofqual
    name: Ofqual (gov.uk)
    url: https://www.gov.uk/search/news-and-communications.atom?organisations%5B%5D=ofqual
    weight: 1.0
    enabled: true

  - id: guardian-education
    name: Guardian Education
    url: https://www.theguardian.com/education/rss
    weight: 0.5
    enabled: true

  - id: guardian-schools
    name: Guardian Schools
    url: https://www.theguardian.com/education/schools/rss
    weight: 0.5
    enabled: true

  - id: historyextra
    name: HistoryExtra
    url: https://www.historyextra.com/feed
    weight: 0.0
    enabled: true
    note: >
      BBC History Magazine's site. Verified reachable 2026-08-21. Weighted
      neutral rather than up, deliberately: unlike the sources above this is
      general public history content (narrative features, quizzes,
      crosswords), not teaching/curriculum news, so a source-level nudge
      would be a false signal here -- let topic scoring alone decide which
      pieces are actually relevant to a trainee. A weekly quiz/crossword mute
      group in scoring.yml sinks the pure trivia entries.

  - id: oxford-education
    name: Oxford Department of Education
    url: https://www.education.ox.ac.uk/feed/?post_type=news
    weight: 0.0
    enabled: true
    note: >
      Verified reachable 2026-08-21 -- note the ?post_type=news query string;
      the plain /feed/ on this WordPress site is real but always empty
      because their news items are a custom post type, not the default
      "post". Content is genuine education research (pupil feedback studies,
      AI in education, national policy evaluations) alongside some internal
      academic news (staff honours, PhD/fellowship announcements) that isn't
      classroom-relevant, so weighted neutral like HistoryExtra -- the
      cog-cognitive-load topic group is what should surface the good pieces.

  - id: nottingham-education
    name: Nottingham School of Education
    url: https://www.nottingham.ac.uk/education/news/index.aspx?schoolNewsListings_SyndicationType=1
    weight: 0.0
    enabled: true
    note: >
      Verified reachable 2026-08-21. Same profile as Oxford above: real
      pedagogy/education-research content mixed with international
      partnership and staff-award announcements, so weighted neutral rather
      than up.

  # ---- Disabled by default ----------------------------------------------
  # These either have no public feed or could not be confirmed at build time.
  # Enable one and run `python -m src.validate` to see whether it resolves.

  - id: sec-ed
    name: SecEd
    url: https://www.sec-ed.co.uk/rss/
    weight: 1.0
    enabled: false
    note: Secondary-focused practitioner writing. URL unconfirmed.

  - id: eef
    name: Education Endowment Foundation
    url: https://educationendowmentfoundation.org.uk/news/rss
    weight: 1.5
    enabled: false
    note: >
      Evidence summaries and trial reports. URL unconfirmed but worth
      chasing — this is the closest thing to a research feed for teaching.

  - id: tes
    name: Tes
    url: ""
    weight: 1.5
    enabled: false
    note: >
      Tes retired its public RSS feed; the old /magazine/rss.xml now serves a
      migration notice. Two options if you want Tes in the brief:
        1. Subscribe to a Tes newsletter with an Inoreader or Kill-the-Newsletter
           address, which turns the email into a feed URL you can paste above.
        2. Point this at an RSS-bridge instance that scrapes tes.com/magazine/news.
      Left disabled rather than guessing at a URL that would fail silently.

  - id: history-today
    name: History Today
    url: https://www.historytoday.com/feed/blog.xml
    weight: 0.0
    enabled: false
    note: >
      Investigated 2026-08-21 looking for a history-specific source. The feed
      URL is real, but historytoday.com returns 403 to every automated
      request tried (custom UA, plain browser UA, with and without the
      redirect chain) -- it's bot-blocked at the CDN, not a feed problem.
      Left disabled rather than an enabled entry that would just show up as a
      permanently unhealthy source in meta.json. Revisit if they ever loosen
      that block, or if you want to route it through an RSS-bridge instance
      the way Tes above suggests.

  # ---- Investigated, not worth a config entry -----------------------------
  # Also checked 2026-08-21 while looking for history-specific sources, no
  # config entry because there's no usable URL at all (not even a disabled
  # placeholder to revisit):
  #   - Historical Association (history.org.uk): no RSS anywhere on the
  #     site (checked /feed, /news/feed, /blog/feed, /rss, and homepage
  #     RSS autodiscovery -- none exist). Their old blog at
  #     historyjournal.org.uk/feed is real but explicitly discontinued
  #     ("blog moves to HA website", archived as of Oct 2024, nothing since).
  #   - Schools History Project (schoolshistoryproject.org.uk): the domain
  #     no longer belongs to SHP -- it now redirects to and serves an
  #     unrelated online-casino affiliate site. Not a feed issue; don't
  #     point anything at this domain until/unless SHP is confirmed to have
  #     it back.
  #   - School History (schoolhistory.co.uk/feed): a real, working feed, but
  #     its most recent entry was 5 months old at the time of checking and
  #     its content is SEO-style "Facts & Worksheets" reference pages (some
  #     for the Scottish National 5 syllabus, which scoring.yml's
  #     not-england mute would sink anyway) rather than news -- not a good
  #     fit for a twice-weekly news brief even if it were fresher.
  #
  # Also checked 2026-08-21 while looking for pedagogy/education-research
  # sources (UCL IOE and Nottingham suggested by the owner; Oxford and
  # Nottingham are enabled above, the rest weren't usable):
  #   - UCL Institute of Education (ucl.ac.uk/ioe): no RSS autodiscovery on
  #     the news page, and every guessed feed path (/rss.xml, /news/rss.xml)
  #     returns Cloudflare's "Just a moment..." JS-challenge interstitial --
  #     same class of block as Schools Week/FE Week, not fixable client-side.
  #   - Durham University School of Education: the department news page and
  #     the university-wide /feeds/ index both return 403 from CloudFront.
  #   - Cambridge (Faculty of Education) and Manchester (Institute of
  #     Education): no department-specific feed found, only a whole-university
  #     newsroom feed (cam.ac.uk/news/feed, manchester.ac.uk/about/news/) --
  #     skipped as too broad; a feed covering every department from medicine
  #     to engineering would mostly just add noise here.
  #   - Bristol, Birmingham, King's College London, Exeter: no working feed
  #     found at their most likely URLs (checked /education/news/feed and
  #     equivalents; Exeter's redirects to a plain HTML page, the others 404).
  #     Not exhaustively checked -- may be worth a second pass with more
  #     specific URLs if one of these becomes a priority.
