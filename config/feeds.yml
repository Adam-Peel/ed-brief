  - id: history-of-england
    name: The History of England Blog
    url: https://www.thehistoryofengland.co.uk/feed/
    weight: 1.0
    enabled: false
    note: >
      Disabled 2026-08-21 at the owner's request -- judged low quality.

  - id: visit-nottinghamshire
    name: Visit Nottinghamshire
    url: https://www.visit-nottinghamshire.co.uk/feeds/rss/highlightedproducts/?channel=NOTTSEVRSS
    weight: 0.0
    enabled: false
    note: >
      Added 2026-08-21, suggested by the owner as an events/heritage-trails
      feed; disabled 2026-08-21 at the owner's request -- too niche for the
      signal it carries. Real problem, not just a preference: most entries
      are events-listing items with a completely empty <content:encoded> at
      source (confirmed against the raw feed, not a fetch.py extraction
      gap), so classify.py sees title-only for a large share of what this
      source contributes. What content there was, was mostly generic
      "what's on" listings (Halloween cinema nights, a touring musical)
      rather than the dedicated heritage feed it was suggested as.

  - id: sec-ed
    name: SecEd
    url: https://www.sec-ed.co.uk/rss/
    weight: 1.0
    enabled: false
    note: >
      Secondary-focused practitioner writing -- exactly the falling-rolls/
      job-market and general professional-context territory the rubric
      added this round. Confirmed 2026-08-21, not just "unconfirmed": this
      URL returns a real HTTP 403, same Cloudflare-class bot block as
      Schools Week/FE Week. SecEd's own site says its news is otherwise
      only distributed via free email bulletins (sec-ed.co.uk/register) --
      a newsletter-bridge candidate, not a feed fix.

  - id: eef
    name: Education Endowment Foundation
    url: https://educationendowmentfoundation.org.uk/news/rss
    weight: 1.5
    enabled: false
    note: >
      Evidence summaries and trial reports -- the closest thing to a
      research feed for the classroom-practice/cog-cognitive-load
      categories. Confirmed 2026-08-21: this exact URL returns a real HTTP
      403, same Cloudflare-class block as Schools Week/FE Week/History
      Today. Not fixable client-side; would need a headless-browser fetcher
      or an RSS-bridge instance in front of it.

  - id: tes
    name: Tes
    url: ""
    weight: 1.5
    enabled: false
    note: >
      Tes retired its public RSS feed; the old /magazine/rss.xml now serves a
      migration notice. Two options if you want Tes in the brief:
        1. Subscribe to a Tes newsletter with an Inoreader or Kill-the-Newsletter
           address, which turns the email into a feed URL you can paste above.
        2. Point this at an RSS-bridge instance that scrapes tes.com/magazine/news.
      Left disabled rather than guessing at a URL that would fail silently.

  - id: history-today
    name: History Today
    url: https://www.historytoday.com/feed/blog.xml
    weight: 0.0
    enabled: false
    note: >
      Investigated 2026-08-21 looking for a history-specific source. The feed
      URL is real, but historytoday.com returns 403 to every automated
      request tried (custom UA, plain browser UA, with and without the
      redirect chain) -- it's bot-blocked at the CDN, not a feed problem.
      Left disabled rather than an enabled entry that would just show up as a
      permanently unhealthy source in meta.json. Revisit if they ever loosen
      that block, or if you want to route it through an RSS-bridge instance
      the way Tes above suggests.

